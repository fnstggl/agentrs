[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crucible"
version = "0.4.0"
description = "Crucible: a persistent, event-sourced synthetic digital civilization for continual and multi-agent RL research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyyaml>=6"]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "httpx>=0.27", "python-multipart>=0.0.9"]
browser = ["playwright>=1.48"]
postgres = ["psycopg[binary]>=3.2"]
rl = ["gymnasium>=1.0", "pettingzoo>=1.24", "torch>=2.4"]
dev = ["pytest>=8", "pytest-timeout>=2", "hypothesis>=6"]
# workstream E2 calibration fitting (installed 2026-11-25: scikit-learn 1.9.1, scipy 1.18.1, joblib 1.6.0,
# threadpoolctl 3.8.0, narwhals 2.29.0); world code needs none of these: fitted models are evaluated in NumPy
v5-calibration = ["scikit-learn>=1.6", "scipy>=1.11", "threadpoolctl>=3.5", "pandas>=2.0"]

[project.scripts]
crucible = "crucible.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crucible = ["web/templates/*.html", "web/static/*", "dashboard/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
markers = [
  "slow: long-running tests",
  "browser: requires Playwright + Chromium",
  "postgres: requires a local PostgreSQL server binary",
  "sandbox: requires Landlock + seccomp for untrusted code",
]
