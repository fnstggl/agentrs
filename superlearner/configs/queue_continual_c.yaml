# The Meta-Researcher's promoted rule on the real learner (two seeds, matched with `rehearsal`).
#   superlearner jobs configs/queue_continual_c.yaml --log-dir runs/queue_continual_c
max_gpu: 4
max_cpu: 24
strict_order: true
gpu_unit_mb: 3400
gpu_margin_mb: 1500
gpu_settle_s: 180
env: {PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"}
jobs:
  - {name: life_meta_champion_s0, cmd: "python -m superlearner lifetime --config configs/life/meta_champion.yaml --set seed=0 --name life_meta_champion_s0 --run-dir runs/life/meta_champion_s0", gpu: 2, cpu: 12, retries: 4, done: runs/life/meta_champion_s0/DONE}
  - {name: life_meta_champion_s1, cmd: "python -m superlearner lifetime --config configs/life/meta_champion.yaml --set seed=1 --set lifetime.eval.sampled=false --name life_meta_champion_s1 --run-dir runs/life/meta_champion_s1", gpu: 2, cpu: 12, retries: 4, done: runs/life/meta_champion_s1/DONE}
