# Second part of the continual-learning queue: the internalization test with a fully trainable backbone
# (Architecture B). Run after, or next to, configs/queue_continual.yaml (it needs the base learners of that queue).
#   superlearner jobs configs/queue_continual_b.yaml --log-dir runs/queue_continual_b
max_gpu: 3
max_cpu: 30
env: {PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"}
jobs:
  - name: pit_build_observe_practice_backbone_s0
    cmd: python -m superlearner pit route --config configs/pit.yaml --seed 0 --family build --route observe_practice_backbone
    gpu: 3
    cpu: 10
    retries: 2
    done: runs/pit/s0/build__observe_practice_backbone/pit.json
  - name: pit_repair_observe_practice_backbone_s0
    cmd: python -m superlearner pit route --config configs/pit.yaml --seed 0 --family repair --route observe_practice_backbone
    gpu: 3
    cpu: 10
    retries: 2
    done: runs/pit/s0/repair__observe_practice_backbone/pit.json
  - name: pit_build_observe_practice_backbone_s1
    cmd: python -m superlearner pit route --config configs/pit.yaml --seed 1 --family build --route observe_practice_backbone
    gpu: 3
    cpu: 10
    retries: 2
    done: runs/pit/s1/build__observe_practice_backbone/pit.json
  - name: pit_repair_observe_practice_backbone_s1
    cmd: python -m superlearner pit route --config configs/pit.yaml --seed 1 --family repair --route observe_practice_backbone
    gpu: 3
    cpu: 10
    retries: 2
    done: runs/pit/s1/repair__observe_practice_backbone/pit.json
  - name: pit_report
    cmd: python -m superlearner pit report --config configs/pit.yaml
    cpu: 1
    after: [pit_build_observe_practice_backbone_s0, pit_repair_observe_practice_backbone_s0, pit_build_observe_practice_backbone_s1, pit_repair_observe_practice_backbone_s1]
