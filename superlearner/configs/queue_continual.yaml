# The continual-learning experiments as one restartable queue (docs/CONTINUAL.md):
#   superlearner jobs configs/queue_continual.yaml --log-dir runs/queue_continual
# * `life_<condition>_s<seed>`  lifetimes over six phases for the compared conditions (five required conditions plus
#   two intermediate amounts of backbone plasticity);
# * `pit_*`                     the Parametric Internalization Test: base learners, then one job per unfamiliar
#   family, route and seed, each ending with weights-only evaluations in fresh processes.
# No language-model server is needed: every run hosts its own Qwen3-0.6B backbone (frozen or trainable).
# Jobs are ordered so that seed 0 of everything finishes first. A job whose `done` file exists is skipped, and an
# interrupted lifetime continues from its last completed step.
max_gpu: 5
max_cpu: 48
env: {PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"}
jobs:
  - name: pit_base_s0
    cmd: python -m superlearner pit base --config configs/pit.yaml --seed 0
    gpu: 1
    cpu: 10
    retries: 2
    done: runs/pit/s0/base/weights.pt
  - name: pit_base_mem_s0
    cmd: python -m superlearner pit base --config configs/pit.yaml --seed 0 --memory
    gpu: 1
    cpu: 10
    retries: 2
    done: runs/pit/s0/base_mem/weights.pt
  - name: life_frozen_memory_s0
    cmd: python -m superlearner lifetime --config configs/life/frozen_memory.yaml --set seed=0 --name life_frozen_memory_s0 --run-dir runs/life/frozen_memory_s0
    gpu: 1
    cpu: 12
    retries: 2
    done: runs/life/frozen_memory_s0/DONE
