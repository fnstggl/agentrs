# The continual-learning experiments as one restartable queue (docs/CONTINUAL.md):
#   superlearner jobs configs/queue_continual.yaml --log-dir runs/queue_continual
# * `life_<condition>_s<seed>`  lifetimes over six phases: conditions 1, 2 and 4b on three seeds; 3, 4a and the fully
#   trainable backbone on two; adapters (LoRA) and the top four blocks on one. Seeds 1 and 2 skip sampled evaluations.
#   The rule the Meta-Researcher promoted (`meta_champion`) runs on two seeds, matched with `rehearsal`.
#   The rule promoted by the equal-compute search runs at the full and at half the supervised steps (two seeds each).
# * `pit_*`  the Parametric Internalization Test: base learners, then one job per unfamiliar family, route and seed
#   (learning routes on three seeds, control routes and the trainable-backbone route on two), each ending with
#   weights-only evaluations in fresh processes.
# No language-model server is needed: every run hosts its own Qwen3-0.6B backbone (frozen or trainable).
# A job whose `done` file exists is skipped; an interrupted lifetime continues from its last completed step.
# `gpu` counts units of `gpu_unit_mb` of GPU memory, measured on these runs: an internalization-test job 1, a lifetime
# with a frozen backbone 2, with adapters or top blocks 3, with the fully trainable backbone 5. A GPU job starts only
# when the card really has that much free, because other sessions may share it. `strict_order` keeps the order of
# this file, so that a large job is not starved by smaller ones. `cpu` counts rollout workers.
max_gpu: 9
max_cpu: 120
strict_order: true
gpu_unit_mb: 3400
gpu_margin_mb: 3000
gpu_settle_s: 180
env:
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
jobs:
