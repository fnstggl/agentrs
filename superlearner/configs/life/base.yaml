# Lifelong learning, shared settings (docs/CONTINUAL.md). Conditions are the other files in this directory.
#   superlearner lifetime --config configs/life/<condition>.yaml --set seed=1 --name life_<condition>_s1
#
# The learner: the 19.7M-parameter CAM controller with an online world model (1.06M), and a language backbone
# (Qwen3-0.6B, the 25 blocks that feed the text read-out) that embeds every text the controller reads. In this file
# the backbone is frozen (`mode: none`); `backbone_*.yaml` make parts of it or all of it trainable.
# The 14B generator is not used here: the eight task arms of the sequence need no LLM-written content.
name: life
seed: 0
device: auto
workers: 12
traj_per_iter: 1
llm: {kind: none}
backbone: {model: Qwen/Qwen3-0.6B, mode: none, chunk_tokens: 3000}
model: {}
agent: {use_llm: false, affinity_tokens: true}
core: {max_decisions: 40}
explore: {frac: 0.125, temperature: 2.5, random: true}     # exploratory episodes: world-model data, off-policy
algo:
  name: continual
  lr: 0.00005
  epochs: 3
  minibatch_eps: 8
  gamma: 0.995
  lam: 0.95
  clip: 0.1
  vf_coef: 0.5
  ent_coef: 0.003
  target_kl: 0.03
  max_grad_norm: 1.0
  critic_warmup: 1
  lr_warmup_steps: 40
  detach_critic: true
  sil_steps: 16
  sil_batch: 8
  sil_coef: 1.0
  wm: {enabled: true, coef: 1.0, repr: 0.1, replay_steps: 4, replay_batch: 8, buffer: 400, lr_mult: 4.0, explore_share: 0.5,
       fit_steps: 300, fit_lr: 0.001, fit_batch: 256}
  rehearsal: {keep: false, per_arm: 120}
  anchor: {kind: none, coef: 0.0}
  observe: {steps: 120, lr: 0.0003, rehearse: true, rehearse_frac: 0.5}
  backbone_lr: 0.00001
lifetime:
  memory: false
  wm_holdout: 8
  probe_episodes: 12
  probe_steps: 40
  eval: {per_arm: 12, unseen_worlds: [entrenched_incumbents, fragmented_networks], unseen_per_arm: 4, unseen_only_at_end: true}
  phases:
    - {name: start,   arms: [found/0/scratch, list/0/deployed], worlds: [tiny, bazaar], demos_per_arm: 4, observe_steps: 160, iters: 4, episodes_per_iter: 64}
    - {name: capital, arms: [fund/0/scratch, deploy/0/coded], worlds: [tiny, bazaar], demos_per_arm: 4, observe_steps: 120, iters: 4, episodes_per_iter: 64}
    - {name: operate, arms: [service/0/listed, repair/0/scratch], worlds: [cheap_compute_closed_markets], demos_per_arm: 4, observe_steps: 120, iters: 4, episodes_per_iter: 64}
    - {name: launch,  arms: [service/0/deployed], worlds: [expensive_compute_open_distribution], demos_per_arm: 4, observe_steps: 120, iters: 4, episodes_per_iter: 64}
    - {name: build,   arms: [service/0/coded], worlds: [bazaar, cheap_compute_closed_markets], demos_per_arm: 4, observe_steps: 120, iters: 4, episodes_per_iter: 64}
    # changed dynamics, no demonstrations: the first four skills in two kinds of world they were not learned in
    - {name: shift,   arms: [found/0/scratch, list/0/deployed, fund/0/scratch, deploy/0/coded], worlds: [expensive_compute_open_distribution, cheap_compute_closed_markets], demos_per_arm: 0, iters: 4, episodes_per_iter: 96}
