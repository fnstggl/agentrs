# The Meta-Researcher's search for a better learning rule.
#   superlearner meta-search --config configs/meta_search.yaml --full-feedback [--rounds N] [--resume]
# (--full-feedback screens every proposal of every pool, which is what Experiment F needs; without it only the
#  selected proposals are evaluated, through all stages)
# Inner task: a small controller (hash text embeddings, CPU, confined) is warm-started from two verified
# demonstrations per arm and then trained by the candidate's algorithm on six task arms that need no LLM-written
# content. Every candidate gets the same seeds, demonstrations, experience budget (enforced by the env hub),
# evaluation tasks (held-out seeds, one unfamiliar world family) and hardware.
name: meta_search
seed: 0
rounds: 4
pool: 6
per_round: 2
develop_top: 4      # single-seed screening is noisy (see RESULTS): the four best screened candidates get more seeds
selection: surrogate
sources: {rule_space: 3, llm: 2, learned_rule: 1}
max_parallel: 6
primary: aulc_eval
# The reported search ran before the inert-change probe existed, so it is switched off here to keep an interrupted
# and resumed search consistent; its inert candidates are identified afterwards by `experiment e`. New searches
# should leave it on (the default): candidates whose update is identical to the champion's are rejected unrun.
reject_inert: false
screen_margin: 0.03
inner:
  workers: 4
  eval_every: 2
  model: {d: 128, layers: 2, heads: 4, ff: 256, bag_dim: 48, hid: 128}
  agent: {use_llm: false, affinity_tokens: true, use_memory: false, use_tools: false}
  core: {max_decisions: 20}
  algo: {name: ppo, lr: 0.0001, epochs: 3, minibatch_eps: 16, clip: 0.1, target_kl: 0.03, critic_warmup: 1, lr_warmup_steps: 40, detach_critic: true, ent_coef: 0.003}
  curriculum:
    adaptive: true
    gate: false
    world_families: [tiny, bazaar]
    arms:
      - {family: found}
      - {family: fund}
      - {family: list, start: deployed}
      - {family: deploy, start: coded}
      - {family: service, start: listed}
      - {family: repair}
  demos: {episodes: 96, bc_epochs: 60, bc_lr: 0.0005, max_per_arm: 2, bc_minibatch_eps: 3}
eval_arms: [found/0/scratch, fund/0/scratch, list/0/deployed, deploy/0/coded, service/0/listed, repair/0/scratch]
eval_world_families: [tiny, bazaar, entrenched_incumbents]
stages:
  # the three stages use identical run settings, so a seed that was run at an earlier stage is reused.
  # timeout_s is generous on purpose: wall time depends on what else the host is doing and is recorded as a measure;
  # the experience budget (decisions, enforced by the env hub) is what makes runs comparable.
  screen: {seeds: [1], iters: 8, episodes_per_iter: 32, budget: 4000, eval_n: 24, timeout_s: 5400}
  develop: {seeds: [1, 2, 3], iters: 8, episodes_per_iter: 32, budget: 4000, eval_n: 24, timeout_s: 5400}
  confirm: {seeds: [1, 2, 3, 4, 5], iters: 8, episodes_per_iter: 32, budget: 4000, eval_n: 24, timeout_s: 5400}
