[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superlearner"
version = "4.0.0"
description = "CAM Superlearner 4.0: a neural agent that learns in Crucible worlds, and a meta-researcher that searches for better learning algorithms"
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "pyyaml"]

[project.optional-dependencies]
llm = ["transformers"]

[project.scripts]
superlearner = "superlearner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA GPU and locally cached Qwen3 weights", "slow: long-running"]
