[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrs"
version = "0.1.0"
description = "Action-learning agent research platform: world-model-based RL with observational learning"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "transformers>=4.50",
  "peft>=0.13",
  "accelerate>=0.34",
  "safetensors",
  "tokenizers",
  "pydantic>=2.6",
  "pyarrow>=15",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6",
  "gymnasium>=1.0",
  "tensorboard>=2.15",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
browser = ["playwright>=1.48", "beautifulsoup4>=4.12", "lxml<6", "pillow>=10", "pyparsing>=3"]
dev = ["pytest>=8", "pytest-timeout>=2"]
harness = ["fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2",
           "httpx>=0.27", "cryptography>=43", "prometheus_client>=0.20", "redis>=5", "boto3>=1.34",
           "aiosmtpd>=1.4", "pyjwt>=2.8", "pynacl>=1.5", "opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25",
           "python-multipart>=0.0.9", "playwright>=1.48"]
harness-test = ["moto[server]>=5"]
live = ["httpx>=0.27", "websockets>=15", "pyyaml>=6"]

[project.scripts]
agentrs = "agentrs.cli:main"

[tool.setuptools.package-data]
"agentrs.harness" = ["migrations/*.mako", "migrations/*.py", "migrations/versions/*.py"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 900
markers = [
  "slow: long-running learning tests",
  "browser: requires Playwright + Chromium",
  "network: requires downloading a pretrained model",
]
