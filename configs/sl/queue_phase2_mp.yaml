  set:
    seed: 1
    families:
      mp/bach_or_stravinsky_in_the_matrix__repeated: 1.0
    heldout_families: []
    init_from: /workspace/agentrs/runs/sl_mp/P_MP6_s1/ckpt/life_2000000
