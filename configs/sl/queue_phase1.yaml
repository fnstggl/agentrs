# Superlearner Phase 1 (CAM simulators + Vending-Bench). Generated; see docs/superlearner.md (amendment 5: experienced
# transfers start from life_1000000 once it exists; lifetime-level curve at 250k/500k; 2M level where reached).
# Transfer runs monitor their source families (retention / forgetting); scratch runs monitor negotiation+product.
# Amendment 11: T_B16_scratch/fromN/fromNP s1-s2 (sl-exp-v16: familiarity gate, model.fam_gate_n0 = 4096) test H10
# (negative transfer to bizdev is caused by confident action preferences not earned in the new world).
# Amendment 10: T_V15_scratch_s1/s2 (sl-exp-v15 Vending: the operator stays liable for the whole fee contract) test H9;
# T_V14_scratch_s1/s2 never trained (their smokes failed the reward audit: closure was cheaper than paying).
# Amendment 9: T_V14_scratch_s1/s2 (sl-exp-v14 Vending: minimum order observed, only valid order quantities) test H9.
# Amendment 8: T_V13_scratch_s1/s2 (sl-exp-v13 Vending adapter: accrual accounting + world-time dt) test H8; the v10
# Vending transfer jobs (T_V_from*) are kept but moved to the end of the queue.
# Amendment 7: D_P12c_s1/s2 (sl-exp-v12, training-only goal curriculum on product) test H7 against D_P11_s1.
# Amendment 6: bizdev-target runs (T_B11_*) and the product diagnostic D_P11 use sl-exp-v11 (shaping discounted with the
# learner's discount); everything else keeps sl-exp-v10. v10 T_B_scratch_s1..3 are kept as the record of the defect.
runs_root: /workspace/agentrs/runs/sl
src: /workspace/agentrs-sl-exp/src
module: agentrs.sl.train
max_jobs: 8
max_load: 40
min_free_mib: 8000
min_free_disk_gb: 20
min_free_pids: 40
pids_per_job: 16  # training threads + backup watcher, and a concurrent smoke (sl-ops-v16)
threads: 4
smoke: true
smoke_set:
  max_env_steps: 512
  n_worlds: 8
  seg_len: 16
  eval_tasks: 2
  test_tasks: 2
  eval_at:
  - 0
  - 256
  lifetime_ckpts:
  - 256
  hours: 1.0
  final_reserve_h: 0.0
  learner:
    mb_streams: 4
smoke_timeout_s: 3600  # transfer smokes with a Vending retention monitor take ~35 min (diagnostics on every monitored family)
crash_repeat_limit: 2
max_starts: 4
gh_backup: true
backup_every_h: 3
jobs:
- name: P_NPV_s1
  config: configs/sl/pretrain.yaml
  set:
    seed: 1
    families:
      cam/negotiation: 1.0
      cam/product: 1.0
      ext/vending: 1.0
    heldout_families:
    - cam/bizdev
- name: P_NPB_s1
  config: configs/sl/pretrain.yaml
