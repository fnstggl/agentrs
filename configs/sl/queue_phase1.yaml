# Superlearner Phase 1 (CAM simulators + Vending-Bench). Generated; see docs/superlearner.md.
# Transfer runs monitor their source families (retention / forgetting); scratch runs monitor negotiation+product.
runs_root: /workspace/agentrs/runs/sl
src: /workspace/agentrs-sl-exp/src
module: agentrs.sl.train
max_jobs: 8
min_free_mib: 8000
min_free_disk_gb: 20
threads: 4
smoke: true
smoke_set:
  max_env_steps: 512
  n_worlds: 8
  seg_len: 16
  eval_tasks: 2
  test_tasks: 2
  eval_at:
  - 0
  - 256
  lifetime_ckpts:
  - 256
  hours: 1.0
  final_reserve_h: 0.0
  learner:
    mb_streams: 4
smoke_timeout_s: 1800
crash_repeat_limit: 2
max_starts: 4
gh_backup: true
backup_every_h: 3
jobs:
- name: P_NPV_s1
  config: configs/sl/pretrain.yaml
  set:
    seed: 1
    families:
      cam/negotiation: 1.0
      cam/product: 1.0
      ext/vending: 1.0
    heldout_families:
    - cam/bizdev
- name: P_NPB_s1
  config: configs/sl/pretrain.yaml
  set:
    seed: 1
    families:
      cam/negotiation: 1.0
      cam/product: 1.0
