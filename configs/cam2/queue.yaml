# CAM-v2 controlled experiments, started in priority order as GPU capacity frees (see scripts/cam2_queue.py).
# Every product/negotiation arm: same config (offpolicy.yaml), same 600k real-interaction budget, same
# evaluation protocol (unchanged full-difficulty validation/test goals); only the named component differs.
runs_root: /workspace/agentrs/runs/cam2
src: /workspace/agentrs-cam-v2/src
max_with_qwen: 3          # CAM GPU processes allowed while the Qwen-LoRA run is active (= today's load)
max_without_qwen: 6
min_free_mib: 7000
start_deadline_utc: "2026-11-18T16:00:00+00:00"
reserved_programs:
  - [agentrs_cam_pfix, /workspace/agentrs/runs/cam_pfix, product_fix.yaml]
jobs:
  - {name: cam2_awr_s1, config: configs/cam2/offpolicy.yaml, set: {seed: 1}}
  - {name: cam2_dreamD_s1, config: configs/cam2/offpolicy.yaml, set: {seed: 1, dream: {mode: adaptive, horizon: 8, updates_per_iter: 16, starts: 256, batch_episodes: 32, start_iter: 5, kappa: 1.0, err_ref: 0.1, err_max: 0.1, u_quantile: 0.8}}}
  - {name: cam2_dreamH1_s1, config: configs/cam2/offpolicy.yaml, set: {seed: 1, dream: {mode: fixed, horizon: 1, updates_per_iter: 16, starts: 256, batch_episodes: 32, start_iter: 5, kappa: 1.0}}}
  - {name: cam2_dreamH4_s1, config: configs/cam2/offpolicy.yaml, set: {seed: 1, dream: {mode: fixed, horizon: 4, updates_per_iter: 16, starts: 256, batch_episodes: 32, start_iter: 5, kappa: 1.0}}}
  - {name: cam2_sac_s1, config: configs/cam2/offpolicy.yaml, set: {seed: 1, learner: {actor: sac, wm_lr: 3.0e-4, actor_lr: 1.0e-4, critic_lr: 3.0e-4, n_step: 3, c_min: 0.3, awr_beta: 1.0, awr_norm: true, expectile: 0.7, polyak: 0.01, ent_coef: 0.003, sac_target_entropy_frac: 0.5}, model: {d: 256, deter: 512, stoch: 16, classes: 16, hidden: 512, layers: 3, heads: 4, n_options: 1, ens: 4}}}
  - {name: cam2_awr_s2, config: configs/cam2/offpolicy.yaml, set: {seed: 2}}
  - {name: cam2_dreamD_s2, config: configs/cam2/offpolicy.yaml, set: {seed: 2, dream: {mode: adaptive, horizon: 8, updates_per_iter: 16, starts: 256, batch_episodes: 32, start_iter: 5, kappa: 1.0, err_ref: 0.1, err_max: 0.1, u_quantile: 0.8}}}
  - {name: cam2_dreamH1_s2, config: configs/cam2/offpolicy.yaml, set: {seed: 2, dream: {mode: fixed, horizon: 1, updates_per_iter: 16, starts: 256, batch_episodes: 32, start_iter: 5, kappa: 1.0}}}
  - {name: cam2_dreamH4_s2, config: configs/cam2/offpolicy.yaml, set: {seed: 2, dream: {mode: fixed, horizon: 4, updates_per_iter: 16, starts: 256, batch_episodes: 32, start_iter: 5, kappa: 1.0}}}
  - {name: cam2_sac_s2, config: configs/cam2/offpolicy.yaml, set: {seed: 2, learner: {actor: sac, wm_lr: 3.0e-4, actor_lr: 1.0e-4, critic_lr: 3.0e-4, n_step: 3, c_min: 0.3, awr_beta: 1.0, awr_norm: true, expectile: 0.7, polyak: 0.01, ent_coef: 0.003, sac_target_entropy_frac: 0.5}, model: {d: 256, deter: 512, stoch: 16, classes: 16, hidden: 512, layers: 3, heads: 4, n_options: 1, ens: 4}}}
  # second environment / transfer / forgetting (bizdev budget = the PPO transfer arms: 60 x 4096 steps)
  - {name: cam2_bizdev_scratch_s1, config: configs/cam2/offpolicy.yaml, set: {seed: 1, train_families: {bizdev: 1.0}, heldout_families: [], curriculum: {}, max_env_steps: 245760, eval_every: 5}}
  - {name: cam2_bizdev_from_awr_s1, after: cam2_awr_s1, config: configs/cam2/offpolicy.yaml, set: {seed: 1, train_families: {bizdev: 1.0}, heldout_families: [], monitor_families: [negotiation, product], curriculum: {}, max_env_steps: 245760, eval_every: 5, init_from: /workspace/agentrs/runs/cam2/cam2_awr_s1/ckpt/best}}
  # component ablations of arm A
  - {name: cam2_awr_noher_s1, config: configs/cam2/offpolicy.yaml, set: {seed: 1, her_p: 0.0}}
  - {name: cam2_awr_noarchive_s1, config: configs/cam2/offpolicy.yaml, set: {seed: 1, archive: {}}}
  - {name: cam2_awr_nolagrange_s1, config: configs/cam2/offpolicy.yaml, set: {seed: 1, lagrangian: {}}}
  - {name: cam2_bizdev_scratch_s2, config: configs/cam2/offpolicy.yaml, set: {seed: 2, train_families: {bizdev: 1.0}, heldout_families: [], curriculum: {}, max_env_steps: 245760, eval_every: 5}}
  - {name: cam2_bizdev_from_awr_s2, after: cam2_awr_s2, config: configs/cam2/offpolicy.yaml, set: {seed: 2, train_families: {bizdev: 1.0}, heldout_families: [], monitor_families: [negotiation, product], curriculum: {}, max_env_steps: 245760, eval_every: 5, init_from: /workspace/agentrs/runs/cam2/cam2_awr_s2/ckpt/best}}
