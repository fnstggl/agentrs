# Local development stack. No production credentials: the inference backend is the mock (or the
# local CPU policy), providers are disabled, and the only enabled environment is SocialWebLab.
#   cp .env.example .env   # then edit; never commit .env
#   docker compose -f deploy/docker-compose.yml --env-file .env up --build
name: agentrs
x-app: &app
  build: {context: .., dockerfile: deploy/Dockerfile}
  env_file: [{path: ../.env, required: false}]
  environment:
    AGENTRS_DATABASE_URL: postgresql+psycopg://agentrs:${POSTGRES_PASSWORD:-agentrs}@postgres:5432/agentrs
    AGENTRS_REDIS_URL: redis://redis:6379/0
    AGENTRS_S3_ENDPOINT: http://minio:9000
    AGENTRS_INFERENCE_URL: http://inference:8100
  volumes: [agentrs-data:/data]
  stop_grace_period: 30s
  restart: unless-stopped
services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: agentrs, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-agentrs}", POSTGRES_DB: agentrs}
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U agentrs"], interval: 5s, retries: 20}
  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20}
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment: {MINIO_ROOT_USER: "${AWS_ACCESS_KEY_ID}", MINIO_ROOT_PASSWORD: "${AWS_SECRET_ACCESS_KEY}"}
    volumes: [minio-data:/data]
    healthcheck: {test: ["CMD", "mc", "ready", "local"], interval: 5s, retries: 20}
  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    depends_on: {postgres: {condition: service_healthy}}
  control:
    <<: *app
    command: ["control", "--port", "8000"]
    environment: {PORT: "8000", AGENTRS_DATABASE_URL: "postgresql+psycopg://agentrs:${POSTGRES_PASSWORD:-agentrs}@postgres:5432/agentrs", AGENTRS_REDIS_URL: "redis://redis:6379/0"}
    ports: ["127.0.0.1:8000:8000"]
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_healthy}}
  inference:
    <<: *app
    command: ["inference", "--port", "8100", "--backend", "${AGENTRS_INFERENCE_BACKEND:-mock}"]
    environment: {PORT: "8100"}
  lab:
    <<: *app
    command: ["lab", "--port", "8765"]
    environment: {PORT: "8765", AGENTRS_LAB_DB: /data/lab.db, AGENTRS_LAB_CLOCK: real}
    ports: ["127.0.0.1:8765:8765"]
  agent-worker:   # agent runtimes + isolated browser workers (Chromium) — resource limited
    <<: *app
    command: ["agent-worker"]
    depends_on: {control: {condition: service_healthy}, inference: {condition: service_healthy}}
    deploy: {resources: {limits: {cpus: "2", memory: 4g}}}
    shm_size: 1g
    security_opt: ["no-new-privileges:true"]
  outcome-worker:
    <<: *app
    command: ["outcome-worker"]
    depends_on: {migrate: {condition: service_completed_successfully}}
volumes: {pg-data: {}, minio-data: {}, agentrs-data: {}}
