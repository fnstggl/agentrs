[program:agentrs_trainer]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/agentrs_trainer.sh
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=20
startretries=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=1200
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_events_enabled=true
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
