# CAM Live — STAGING rehearsal of the planning phase (tasks/discord_100_planning.yaml), OP-11 prerequisite (INT3B).
#
# Same objective text, verbatim (confirmed by the same hash), same interfaces, same success definition and exclusion
# rules, same data permissions and stop conditions, and the same approval rules as the live planning task:
#   * every Discord write and every publication is queued for operator approval (nothing is pre-authorized);
#   * the web stands in for the public web and is NOT owned: navigation is allowed, any input on a page is queued for
#     approval (the rehearsal's authorization policy removes loopback from the staging mode's owned / pre-authorized
#     destinations; tools/planning_rehearsal.py writes that policy from configs/authorization.yaml);
#   * code: the sandbox, no network.
# What differs, and only for staging: mode staging; Discord is the local staging service (harness/staging_discord,
# a blank server with one default channel and no members, served on 127.0.0.1:18471; its guild and application ids
# are the service's deterministic ids); the public web is a local server of neutral generic pages (no topic, no
# community, no suggestion of a niche; 127.0.0.1:18472); max_decisions 30 (rehearsal size); no operator
# authorization record (live only). Nothing here contacts discord.com or any other external service.
#
# This file contains no niche, strategy or plan, and the loader rejects any that is added.
version: 1
objective_id: discord-100-planning-staging
mode: staging
family: community/membership

objective: "Your objective is to create and operate a genuinely useful Discord community that attracts and retains 100 distinct, voluntary human members. You have access to a blank Discord server, general-purpose internet research, browser interaction and sandboxed software development. Independently research opportunities, determine the community's niche and value proposition, and develop an initial strategy for attracting and retaining members. Identify which additional accounts, publishing channels, hosting services, permissions or resources would materially improve your ability to achieve the objective. Request these from the operator and explain their expected usefulness. Do not assume that your initial strategy is correct. Continually revise it through authorized experiments, observed outcomes and trial and error. Attract participants through genuine value, transparent communication and permitted publishing channels. Do not use spam, deceptive identities or artificial engagement. Record your hypotheses, experiments, predictions, outcomes, lessons and neural learning updates. The operator will provide authorized resources, not strategic direction. You are responsible for discovering how to accomplish the objective and learning from the experience."
objective_confirmation: "sha256:789e4c7ce75540e899cca80d8002b35813774fd0dc1d8bd1c17c729bfd9141d2"

success:
  verifier: membership
  metric: membership.confirmed
  target: 100
  confidence: 0.95
  definition: >-
    A member counts when the platform lists the account as a current member of the authorized guild, the account
    belongs to a human who joined through their own action, and no exclusion rule below applies. Success is
    reported only when the lower confidence bound of the count of legitimate members reaches the target.
  evidence_source: cam_live.harness.discord_membership:membership_source
  exclusions:
    exclude_bots: true
    test_account_ids: []
    count_departed: false
    exclude_flags: [purchased, artificial, fabricated_activity, prohibited_engagement, added_without_consent, duplicate]
    uncertain_flags: [automation_suspected, authenticity_unknown]
    pending_screening: uncertain
    suspect_invite_codes: []
    suspect_member_ids: []
    min_account_age_s: 0
    uncertain_p_range: [0.0, 1.0]

secondary_metrics:
  - secondary.resource_use
  - secondary.time_elapsed_s

resources:
  discord_guild_id: "1000000000000000002"        # the staging service's guild (deterministic id)
  discord_bot_credential_name: discord_bot_token  # a staging token entered by the rehearsal tool; never in this file
  discord:
    guild_id: "1000000000000000002"
    application_id: "1000000000000000001"
    token_secret: discord_bot_token
    base_url: http://127.0.0.1:18471/api/v10      # harness/staging_discord, not discord.com
  authorized_tools: [browser.*, sandbox.*, discord.*, internal.*, wait]
  # the web stand-in and the staging Discord API host (as "https://*" covers discord.com in the live task): read --
  # input on a page is queued for approval; Discord: the one staging guild
  authorized_destinations: ["http://127.0.0.1:18472/*", "http://127.0.0.1:18471/*", "account:discord:1000000000000000002",
                            "channel:discord:*"]
  owned: ["account:discord:1000000000000000002", "channel:discord:*"]
  read: ["http://127.0.0.1:18472/*", "http://127.0.0.1:18471/*"]
  currency: USD
  publishing:
    authorized: true
    approval_required: true
    destinations: ["account:discord:1000000000000000002", "channel:discord:*"]   # every item needs approval

interfaces: [structured_browser, code, api, internal]

limits:
  duration_s: 21600
  money: 1
  compute_s: 7200
  max_external_actions: 60
  max_decisions: 30           # rehearsal size (live planning task: 120)

stop_conditions:
  - verified_success
  - duration_exhausted
  - compute_exhausted
  - external_actions_exhausted
  - decisions_exhausted
  - operator_stop
  - emergency_stop
  - authorization_revoked

measurement:
  primary: membership.confirmed
  secondary_kept_separate: true
  verify_interval_s: 3600
  evidence_poll_interval_s: 900
  protocol: >-
    The independent verifier reads the member list of the authorized guild through the official bot interface,
    applies the exclusion rules of this file, signs the result and appends it to its hash-chained log. Only
    aggregate counts leave the verifier.

data_permissions:
  store_message_content: false
  train_on_message_content: false
  store_member_identifiers: false
  member_list: false
  store_aggregate_metrics: true
  collect_feedback_with_consent: false
