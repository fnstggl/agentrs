# CAM Live 1.0 — default configuration (the full candidate: Qwen3-4B backbone + ~50M experiential core).
# Any top-level mapping other than seed/device/home/backbone/core/optim is a subpackage section, read with
# CamLiveConfig.section("<name>") by the subpackage that owns it.
seed: 0
device: auto
home: ""                      # default: <repo>/runs/cam_live ; set CAM_LIVE_HOME to a persistent volume for live runs

backbone:
  name: Qwen/Qwen3-4B
  revision: 1cfa9a7208912126459214e8b04321603b3df60c
  local_files_only: true
  dtype: bfloat16
  tap_layers: [0.5, 0.75, 1.0]
  max_text_tokens: 384
  lora_rank: 32
  lora_alpha: 32.0
  lora_targets: [q_proj, v_proj]
  lora_layers: all
  bridge_tokens: 8
  grad_checkpoint: true

# backbone runtime (nn section, read by nn.presets.NNConfig): the proposer prompt lists every tool the task permits
# (S-6b); on the planning task it is 4.1-5.3 k tokens, so the 2048-token preset window cut the instructions, the
# objective and most tools (INT3B-4: 12 of 12 decisions without a backbone proposal). Qwen3-4B's context is 32 k.
nn:
  max_prompt_tokens: 6144

core:
  scale: 50m                  # debug | 5m | 20m | 50m | 150m | 500m | 1b
  max_context: 256

optim:
  lr_experiential: 3.0e-4
  lr_heads: 3.0e-4
  lr_adapters: 5.0e-5
  lr_reward: 1.0e-4
  inner_lr: 1.0e-2
  inner_steps: 2
  adapter_every: 8
  meta_min_independent_outcomes: 8
  batch_size: 16

# Disk space (cam_live.storage): below min_free_gb no checkpoint is written — the runtime pauses the run with a
# resource obstacle and the learner's promotions are refused; below warn_free_gb a warning is logged.
storage:
  min_free_gb: 20
  warn_free_gb: 50

runtime:
  keep_checkpoints: 2         # runtime checkpoints kept; optimizer state only in the newest
  # shared GPU (runtime.gpu_cycle, INT3B): with a pretrained backbone on CUDA the learner leases the machine's GPU
  # lock — at most gpu_hold_s per hold; at a decision boundary it commits, releases, yields gpu_yield_s and
  # re-acquires in the same process; released whenever the runtime sleeps. Waiting is not charged to compute.
  gpu_lock: auto
  gpu_hold_s: 840
  gpu_yield_s: 15
