# CAM Live authorization policy — default. Schema: docs/EA/POLICY_SCHEMA.md (validated strictly by
# cam_live.harness.auth.schema; an unknown key, a wrong type or a bad pattern makes the service deny everything).
#
# The operator edits a copy of this file; the learner's uid cannot write it, and nothing the learner sends can
# change it. Rules are data. Nothing here says what the agent should do — only what it may not do without the
# operator.
version: 1
policy_id: default-3

grants:
  ttl_s: 120            # a grant must be presented to the executor within this time
  exec_window_s: 900    # longest time one granted action may keep issuing primitive operations
  exec_slack_s: 30      # added to the action's own timeout

approvals:
  ttl_s: 86400          # a pending request expires; an approval must be used within this time as well

structure:
  max_depth: 6          # nesting of ActionSpec.steps
  max_nodes: 128        # actions inside one program
  max_argument_bytes: 262144

# ---------------------------------------------------------------------------------------------------------------
# Task modes. A mode is an envelope no task can leave.
# ---------------------------------------------------------------------------------------------------------------
modes:
  diagnostic:                       # simulations with known ground truth: nothing leaves the machine
    max_effect: local
    url_envelope: []
    owned: []
    read: []
    preauthorized: []
    honour_task_resources: false
    default_interfaces: [internal, api, code]
    simulated_money: true
    interact_non_owned: {navigate: deny, input: deny}
    code_network: deny
    requires_authorization_record: false
    caps: {money: 1000000.0, money_per_action: 1000000.0, money_per_day: 1000000.0, compute_s: 86400.0,
           max_external_actions: 0, max_decisions: 1000000, duration_s: 0.0}
  staging:                          # the operator's local staging services only
    # Loopback is the envelope, but a loopback port is reachable only when it is a registered local service
    # (destinations.local_services, PolicyService.register_local_service, or -- own_process_services -- a port
    # every listener of which belongs to the authorization service's own process). The instance's control plane
    # (portal, Jupyter, SSH, tunnels, IDE servers) is never reachable.
    max_effect: external_write
    url_envelope: ["127.0.0.1", "localhost", "[::1]"]
    owned: ["127.0.0.1", "localhost", "[::1]", "channel:staging:*", "account:staging:*"]
    read: []
    preauthorized: ["127.0.0.1", "localhost", "[::1]", "channel:staging:*", "account:staging:*"]
    honour_task_resources: true     # task.resources may add logical (account/channel) destinations and file roots
    default_interfaces: [internal, structured_browser, visual, code, api, skill]
    simulated_money: true
    interact_non_owned: {navigate: allow, input: needs_approval}
    code_network: deny
    requires_authorization_record: false
    caps: {money: 1000.0, money_per_action: 100.0, money_per_day: 1000.0, compute_s: 86400.0,
           max_external_actions: 100000, max_decisions: 100000, duration_s: 0.0}
    own_process_services: true
    rate_caps:                      # task.resources.rate_limits may set these up to (count) / down to (window)
      write: {count: 600, window_s: 3600}
      write_global: {count: 3000, window_s: 3600}
  live:                             # real destinations: only what a signed operator authorization record names
    max_effect: external_write
    url_envelope: null              # taken from the authorization record
    owned: []
    read: []
    preauthorized: []
    honour_task_resources: false
    default_interfaces: []          # a live task must list its interfaces explicitly
    simulated_money: false
    interact_non_owned: {navigate: allow, input: needs_approval}
    code_network: needs_approval
    requires_authorization_record: true
    caps: {money: 0.0, money_per_action: 0.0, money_per_day: 0.0, compute_s: 0.0,
           max_external_actions: 0, max_decisions: 0, duration_s: 0.0}   # 0 = must come from the record / task
    own_process_services: false
    rate_caps:                      # the signed record's rate_limits may set these at most
      write: {count: 60, window_s: 3600}
      write_global: {count: 200, window_s: 3600}

destinations:
  deny: []                          # never, whatever a task or record says
  interactive: []                   # non-owned sites where sending form input is allowed without approval
  # An address of this machine or its link (loopback in every spelling, 0.0.0.0, link-local / metadata, private
  # networks, this machine's interface addresses, names /etc/hosts maps to them) is denied in EVERY mode unless the
  # exact host:port is listed here, registered at run start (PolicyService.register_local_service) or, in a mode
  # with own_process_services, served by the authorization service's own process.
  local_services:
    - "127.0.0.1:8765"              # reference staging port of the EA tests and verification probes; nothing of
                                    # this instance listens there -- remove the entry if anything ever does
  # file roots: the sandbox, artifacts and the computer environment's workspace (uploads come from there). A more
  # specific file root inside a protected path wins over the protected path.
  file_roots: ["{run_dir}/sandbox", "{run_dir}/artifacts", "{run_dir}/workspace", "{run_dir}/exec/workspace"]
  protected_paths: ["{run_dir}/vault", "{run_dir}/auth", "{run_dir}/audit.jsonl", "{run_dir}/verifier",
                    "{run_dir}/verifier.jsonl", "{run_dir}/browser_profile", "{run_dir}/browser", "{run_dir}/env",
                    "{run_dir}/events.jsonl", "{run_dir}/exec", "/etc/shadow", "/root", "/proc", "/sys"]

# ---------------------------------------------------------------------------------------------------------------
# Tool table. First match wins. An operation that matches nothing is denied.
#   effect: none | local | external_read | external_write | interact | by_method
#   dests:  where the destination is read from the typed action (never from page text)
# ---------------------------------------------------------------------------------------------------------------
tools:
  - id: T-INTERNAL
    ops: [wait, think, noop, inspect, "inspect.*", "internal.*", "memory.*", "note.*", "journal.*", "experiment.*"]
    modalities: [internal]
    effect: none
  - id: T-PROGRAM                   # a composition of typed steps; every step is judged (and charged) on its own
    ops: [program]
    modalities: [internal]
    effect: none
  - id: T-LAB
    ops: ["lab.*"]
    modalities: [api, internal]
    effect: none
    modes: [diagnostic]
  - id: T-BROWSER-NAVIGATE
    ops: [browser.navigate, browser.goto, browser.open]
    modalities: [structured_browser, visual]
    effect: external_read
    sets_location: true
    dests: [{kind: url, from: [arguments.url, target], required: true}]
  - id: T-BROWSER-TAB
    ops: [browser.open_tab, browser.new_tab]
    modalities: [structured_browser, visual]
    effect: external_read
    sets_location: true
    dests: [{kind: url, from: [arguments.url, target]}]
  - id: T-BROWSER-HISTORY
    ops: [browser.back, browser.forward, browser.reload]
    modalities: [structured_browser, visual]
    effect: external_read
    dests: [{kind: url, from: [arguments.page_url], location: true}]
  - id: T-BROWSER-OBSERVE
    ops: [browser.inspect, browser.read, browser.observe, browser.snapshot, browser.screenshot, browser.scroll,
          "browser.wait*", browser.tabs, browser.list_tabs, browser.select_tab, browser.switch_tab,
          browser.close_tab, "browser.get_*", "browser.find*", "browser.extract*", browser.hover, browser.diff]
    modalities: [structured_browser, visual]
    effect: none
  - id: T-BROWSER-DOWNLOAD
    ops: [browser.download]
    modalities: [structured_browser, visual]
    effect: external_read
    dests: [{kind: url, from: [arguments.url, target, arguments.page_url], location: true, required: true},
            {kind: file, from: [arguments.path, arguments.save_as]}]
  - id: T-BROWSER-UPLOAD
    ops: [browser.upload]
    modalities: [structured_browser, visual]
    effect: interact
    interact_class: input
    dests: [{kind: url, from: [arguments.page_url, arguments.url], location: true, required: true},
            {kind: file, from: [arguments.path, arguments.file, arguments.files], multi: true, required: true}]
  - id: T-BROWSER-CLICK
    ops: [browser.click, browser.dblclick, browser.double_click]
    modalities: [structured_browser, visual]
    effect: interact
    interact_class: navigate
    dests: [{kind: url, from: [arguments.page_url, arguments.url], location: true, required: true}]
  - id: T-BROWSER-REQUEST           # first cross-origin subresource request of a page per origin (EB change request 7)
    ops: [browser.request]
    modalities: [structured_browser, visual]
    effect: by_method
    counts_as_action: false         # part of loading a page the action already loads; rate limits still apply
    dests: [{kind: url, from: [arguments.url], required: true}]
  - id: T-BROWSER-INPUT
    ops: ["browser.*"]              # fill, type, press, select_option, check, submit, drag and anything not listed
    modalities: [structured_browser, visual]
    effect: interact
    interact_class: input
    dests: [{kind: url, from: [arguments.page_url, arguments.url], location: true, required: true}]
  - id: T-VISUAL-OBSERVE
    ops: [visual.screenshot, visual.crop, visual.observe, visual.locate, visual.ground, visual.scroll, visual.move,
          "visual.cursor*"]
    modalities: [visual]
    effect: none
  - id: T-VISUAL-CLICK
    ops: [visual.click, visual.double_click, visual.dblclick]
    modalities: [visual]
    effect: interact
    interact_class: navigate
    dests: [{kind: url, from: [arguments.page_url, arguments.url], location: true, required: true}]
  - id: T-VISUAL-INPUT
    ops: ["visual.*"]               # type, key, shortcut, drag and anything not listed
    modalities: [visual]
    effect: interact
    interact_class: input
    dests: [{kind: url, from: [arguments.page_url, arguments.url], location: true, required: true}]
  - id: T-CODE-LIST               # S-4: listing without a path lists the sandbox workspace root (schema default)
    ops: [sandbox.list_files]
    modalities: [code, skill]
    effect: local
    dests: [{kind: file, from: [arguments.path, target]}]
  - id: T-CODE-FILES
    ops: [sandbox.write_file, sandbox.read_file, sandbox.delete_file, sandbox.mkdir,
          "file.*", "fs.*"]
    modalities: [code, skill]
    effect: local
    dests: [{kind: file, from: [arguments.path, target], required: true}]
  - id: T-CODE-RUN
    ops: ["sandbox.*", "code.*", "job.*", "jobs.*"]
    modalities: [code, skill]
    effect: local
    opaque: true
    network_flags: [network, allow_network, net, internet]
    dests: [{kind: url, from: [arguments.hosts, arguments.allowed_hosts, arguments.network_hosts], multi: true},
            {kind: file, from: [arguments.cwd, arguments.workdir]}]
  - id: T-CODE-CONNECT              # one outbound TCP connection of a program run with network='scoped' (the
                                    # sandbox's egress broker asks for each); only to a host the run declared
    ops: [net.connect]
    modalities: [code, skill]
    effect: external_read
    counts_as_action: false         # part of the granted program run; rate limits still apply
    declared_hosts: true
    dests: [{kind: url, from: [arguments.dest, arguments.host], required: true}]
  - id: T-NET-REQUEST
    ops: [net.request, http.request, http.get, http.head, http.post, http.put, http.patch, http.delete,
          api.request, api.http, api.get, api.post, api.put, api.patch, api.delete, api.call]
    modalities: [api, code, structured_browser, visual, skill]
    effect: by_method
    dests: [{kind: url, from: [arguments.url, target], required: true}]
    content_from: [arguments.body, arguments.json, arguments.data, arguments.params, arguments.headers]
  - id: T-PUBLISH-DRAFT
    ops: [publish.draft, publish.preview, "publish.list*", "publish.get*", publish.status,
          publishing.draft, publishing.preview]
    modalities: [api, skill, code]
    effect: local
    kind: draft
  - id: T-PUBLISH
    ops: ["publish.*", "publishing.*"]
    modalities: [api, skill]
    effect: external_write
    kind: publish
    dests: [{kind: url, from: [arguments.destination, arguments.url, arguments.site, arguments.channel, target],
             required: true}]
  - id: T-DISCORD-DM
    ops: [discord.dm, discord.send_dm, discord.direct_message, discord.create_dm]
    modalities: [api, skill]
    effect: external_write
    kind: direct_message
    platform: discord
    dests: [{kind: account, platform: discord, from: [arguments.user_id, arguments.recipient, arguments.recipient_id,
                                                      target], required: true}]
  - id: T-DM                        # any other direct-message tool; the recipient is a typed destination string
    ops: ["*.dm", "*.send_dm", "*.direct_message"]
    modalities: [api, skill]
    effect: external_write
    kind: direct_message
    dests: [{kind: url, from: [arguments.recipient, arguments.to, target], required: true}]
  - id: T-DISCORD-MEMBERSHIP
    ops: [discord.add_member, discord.add_members, "discord.join*", discord.accept_invite, discord.create_account,
          discord.register]
    modalities: [api, skill]
    effect: external_write
    kind: member_add
    platform: discord
  - id: T-DISCORD-MESSAGES-READ
    ops: [discord.read_messages, discord.get_messages, discord.list_messages, discord.fetch_messages,
          discord.history, discord.search_messages, discord.get_message]
    modalities: [api, skill]
    effect: external_read
    platform: discord
    data: [message_content_read]
    dests: &discord_dests
      - {kind: account, platform: discord, from: [arguments.guild_id, arguments.server_id]}
      - {kind: channel, platform: discord, from: [arguments.channel_id, arguments.thread_id]}
  - id: T-DISCORD-MEMBERS-READ
    ops: [discord.list_members, discord.get_members, discord.fetch_members, discord.get_member, discord.member_info,
          discord.export_members, discord.search_members]
    modalities: [api, skill]
    effect: external_read
    platform: discord
    data: [member_list, personal_data]
    dests: *discord_dests
  - id: T-DISCORD-MEMBERSHIP-EVENTS # per-member events, reduced to pseudonyms and join times: they process the member
                                    # list, so the task must grant data_permissions.member_list (master decision
                                    # 2026-11-27, G-sec p07); no personal data leaves the adapter
    ops: [discord.get_member_events, discord.listen_events]
    modalities: [api, skill]
    effect: external_read
    platform: discord
    data: [member_list]
    dests: *discord_dests
  - id: T-DISCORD-READ              # aggregate reads: counts only (message text only via discord.read_messages)
    ops: ["discord.get_*", "discord.list_*", "discord.fetch_*", "discord.metrics*", "discord.stats*",
          "discord.analytics*", discord.guild_info, discord.member_count, discord.status]
    modalities: [api, skill]
    effect: external_read
    platform: discord
    data: [aggregate_metrics]
    dests: *discord_dests
  - id: T-DISCORD-WRITE
    ops: ["discord.*"]
    modalities: [api, skill]
    effect: external_write
    kind: publish
    platform: discord
    dests:                          # a write into a channel lands on the channel; its server is checked as context
      - {kind: account, platform: discord, from: [arguments.guild_id, arguments.server_id], context: true}
      - {kind: channel, platform: discord, from: [arguments.channel_id, arguments.thread_id]}
    require_dest: true
  - id: T-PAYMENT
    ops: ["pay.*", "payment.*", "purchase.*", "billing.*", "*.purchase", "*.pay", "*.checkout", "*.buy"]
    modalities: [api, structured_browser, visual, skill]
    effect: external_write
    kind: payment
    amount_from: [arguments.amount, arguments.total, arguments.price]
    dests: [{kind: url, from: [arguments.payee, arguments.merchant, arguments.url, target], required: true}]
  - id: T-SKILL
    ops: ["skill.*"]
    modalities: [skill]
    effect: local                   # a skill has no permission of its own: each primitive it issues is checked
    opaque: true

publishing:
  require_approval: unless_preauthorized      # or: always

# ---------------------------------------------------------------------------------------------------------------
# Standing authorization (operator amendment 2026-11-28, "OPERATIONAL AUTONOMY"; docs/AUTONOMY.md).
# A signed live record may name one of these profiles (record.standing.profile). Routine, reversible operations on
# the destinations the record pre-authorizes (record.preauthorized: CAM's own Discord server, operator-provided
# hosting, approved integrations) then run without per-item approval, and generated code may reach the hosts of
# record.standing.code_network (e.g. package registries) without a per-job approval. Nothing here says what CAM
# should do. The rules below keep the operator's approval in the listed modes whatever a record pre-authorizes;
# spending (P-SPEND-APPROVAL), data use (data_use), the prohibited classes and the hard platform constraints
# (X-HUMAN-VERIFICATION, X-USER-ACCOUNT, X-PLATFORM-ADAPTER) apply unchanged.
# A rule applies to an operation with an external write or input effect when any of its ops / methods / paths /
# fields matches.
# ---------------------------------------------------------------------------------------------------------------
standing:
  profiles: [routine-reversible-1]
  retained_approval:
    modes: [live]
    rules:
      - id: R-IRREVERSIBLE
        class: irreversible
        ops: ["*.delete", "*.delete_*", "*.destroy*", "*.purge*", "*.wipe*", "*.erase*", "*.transfer*",
              "*.revoke*", "*.cancel_subscription*", "*.close_account*"]
        reason: "a consequential operation that cannot be undone needs the operator's approval"
      - id: R-IRREVERSIBLE-HTTP
        class: irreversible
        methods: [DELETE]
        reason: "an HTTP DELETE on an external service needs the operator's approval"
      - id: R-NEW-PERMISSION
        class: new_external_permission
        ops: ["*.register*", "*.signup*", "*.sign_up*", "*.create_account*", "*.oauth*", "*.authorize_app*",
              "*.create_token*", "*.create_api_key*", "*.create_key*", "*.add_bot*", "*.invite_bot*", "*.grant*"]
        paths: ["*/signup*", "*/sign-up*", "*/sign_up*", "*/register*", "*/registration*", "*/oauth*",
                "*/authorize*", "*/consent*", "*/api-keys*", "*/api_keys*", "*/apikeys*", "*/tokens*",
                "*/access-tokens*", "*/access_tokens*", "*/credentials*", "*/invitations*", "*/members*",
                "*/collaborators*", "*/permissions*", "*/billing*", "*/subscriptions*"]
        reason: "a new account, credential, permission or membership on an external service needs the operator's approval"
      - id: R-PERSON-MESSAGE
        class: message_to_person
        fields: [to, cc, bcc, recipient, recipients, recipient_id, recipient_ids, rcpt, send_to, email_to, to_email,
                 to_address, phone, phone_number, sms_to]
        reason: "a message addressed to a person outside CAM's own infrastructure needs the operator's approval"

spending:
  auto_approve_below: 0.0           # real money above this needs approval even when within the limits
  per_action: 0.0                   # 0 = use the mode cap / record
  per_day: 0.0

# Every external write is counted where it happens: each declared step of an action at authorization (all of them
# must fit), and each external-effect primitive an executor reports through check_primitive (a primitive that
# realises a declared step uses that step's share; any other is charged anew). A skill or a program therefore never
# gets more writes than the same steps issued one by one. Clicks and typing are interactions, not writes.
rate_limits:
  default: {count: 60, window_s: 60}          # authorized action steps per destination
  write: {count: 10, window_s: 3600}          # external writes per destination (task / record: within rate_caps)
  write_global: {count: 60, window_s: 3600}   # external writes of one task across all destinations
  primitive: {count: 600, window_s: 60}       # primitive operations per destination
  per_destination: []                         # [{match: "channel:discord:*", count: 5, window_s: 3600, effects: [external_write]}]

limits:
  max_primitives_per_action: 500              # every primitive operation of one granted action
  max_external_primitives_per_action: 128     # of those, the ones with an external effect

# ---------------------------------------------------------------------------------------------------------------
# Data use. A class is permitted only if TaskSpec.data_permissions[permission] is true (or default is true).
# ---------------------------------------------------------------------------------------------------------------
data_use:
  classes:
    aggregate_metrics: {permission: aggregate_metrics, default: true}
    message_content_read: {permission: read_message_content, default: false}
    message_content_store: {permission: store_message_content, default: false}
    message_content_train: {permission: train_on_message_content, default: false}
    member_list: {permission: member_list, default: false}
    personal_data: {permission: collect_personal_data, default: false}
    private_messages: {never: true}
    individual_profile: {never: true}
  # arguments that ask for something to be kept or learned from; combined with a tool's data classes
  store_flags: [store, save, persist, archive, export, save_to, log_content]
  train_flags: [train, training, finetune, fine_tune, add_to_dataset, learn_from]

# ---------------------------------------------------------------------------------------------------------------
# Platform compliance rules (data; the operator keeps them current with each platform's published terms).
#   when: all listed conditions must hold (modalities / effects / kinds / ops / data). verdict: deny | needs_approval
# ---------------------------------------------------------------------------------------------------------------
platforms:
  discord:
    match: ["discord.com", "*.discord.com", "discord.gg", "discordapp.com", "*.discordapp.com",
            "channel:discord:*", "account:discord:*"]
    require_disclosure: false
    # how logical operations reach the platform's HTTP interface: a grant for the operation on channel {id} covers
    # exactly these requests (never another method, path or channel)
    transport:
      - {ops: [discord.send_message], method: POST, path: "/api/v*/channels/{id}/messages"}
      - {ops: [discord.edit_message], method: PATCH, path: "/api/v*/channels/{id}/messages/*"}
      - {ops: [discord.delete_message], method: DELETE, path: "/api/v*/channels/{id}/messages/*"}
      - {ops: [discord.pin_message], method: PUT, path: "/api/v*/channels/{id}/messages/pins/*"}
      - {ops: [discord.unpin_message], method: DELETE, path: "/api/v*/channels/{id}/messages/pins/*"}
      - {ops: [discord.create_invite], method: POST, path: "/api/v*/channels/{id}/invites"}
      - {ops: [discord.modify_channel], method: PATCH, path: "/api/v*/channels/{id}"}
      - {ops: [discord.delete_channel], method: DELETE, path: "/api/v*/channels/{id}"}
      - {ops: [discord.set_channel_permissions], method: PUT, path: "/api/v*/channels/{id}/permissions/*"}
    rules:
      - id: PL-DISCORD-NO-USER-AUTOMATION
        when: {modalities: [structured_browser, visual], effects: [interact, external_write]}
        verdict: deny
        reason: "ordinary Discord user accounts are not automated; programmatic operations use the official bot interface"
      - id: PL-DISCORD-NO-DM
        when: {kinds: [direct_message]}
        verdict: deny
        reason: "unsolicited direct messages are not sent"
      - id: PL-DISCORD-MESSAGE-CONTENT
        when: {data: [message_content_store, message_content_train]}
        verdict: deny
        reason: "message content obtained through the platform interface is not stored or trained on without express permission"

identity:
  disclosure_text: ""               # e.g. "automated account operated by <owner>"; "" = none configured
  require_disclosure_for_kinds: []  # e.g. [publish, direct_message]; with an empty disclosure_text this denies them
  acting_identities: 1              # one coherent acting identity

# ---------------------------------------------------------------------------------------------------------------
# Prohibited classes (operator specification 12.6). Structural rules deny; rules that need judgement about
# content ask the operator (needs_approval) — they never allow silently.
#
# These detectors are lexical and structural, and every lexical classifier can be evaded by rephrasing. That is
# why, in live mode, every publication or message to an external destination already needs the operator's
# approval unless the signed live record pre-authorizes that destination (publishing.require_approval,
# record.preauthorized): the detectors below are a second line for pre-authorized destinations, not the guarantee
# (docs/EA/SECURITY.md section 2).
# Field names are compared normalised (case, "_", "-" removed); JSON / form-encoded string bodies are parsed and
# their keys checked as well.
# ---------------------------------------------------------------------------------------------------------------
prohibited:
  mass_outreach:
    recipient_fields: [recipients, recipient_ids, recipient_list, rcpt, rcpts, to, user_ids, users, members,
                       member_ids, targets, target_ids, mentions, cc, bcc, audience_ids, emails, email_list,
                       addresses, phone_numbers, numbers, contacts, contact_list, invitees, people, followers,
                       subscribers, dm_targets, send_to, notify]
    max_recipients: 3               # also: recipient-shaped values (addresses, numbers, mentions, handles, user
                                    # ids under a person-like key) in a list under ANY field name
    max_write_destinations: 3
    duplicate: {similarity: 0.8, max_destinations: 2, window_s: 604800, min_chars: 40}
    broadcast_tokens: ["@everyone", "@here"]
    max_mentions: 5                 # more distinct user mentions than this in one outbound content: denied
    mention_patterns:               # applied to every outbound content field
      - {id: M-BROADCAST, kind: broadcast, regex: "(?i)(?<![\\w])@(everyone|here|channel|all|room)\\b"}
      - {id: M-ROLE, kind: broadcast, regex: "<@&\\d+>"}
      - {id: M-SLACK-BROADCAST, kind: broadcast, regex: "<!(channel|here|everyone)(\\|[^>]*)?>"}
      - {id: M-USER, kind: user, regex: "<@!?\\d+>"}
      - {id: M-HANDLE, kind: user, regex: "(?<![\\w@.])@[A-Za-z0-9_][A-Za-z0-9_.]{1,31}\\b"}
  direct_message:
    require_opt_in: true            # recipients must be in task.resources.opted_in_recipients
  identity:
    impersonation_fields: [impersonate, impersonating, impersonate_user, as_user, on_behalf_of, sender_name, from_name,
                           display_name, username, username_override, webhook_username, webhook_name, avatar_url,
                           avatar_override, avatar, persona, pretend_to_be, spoof, spoof_as, nickname, nick,
                           author_name, as_identity, fake_name, act_as]
  membership:
    deny_kinds: [account_create, member_add, join_external]
    fields: [fake_accounts, bot_accounts, alt_accounts, sockpuppets, accounts_to_create, auto_join, bulk_join,
             inflate, fake_members]
  incentives:
    fields: [reward_for_join, pay_per_join, per_member, per_join, per_invite, per_reaction, referral_reward,
             reward_condition, pay_for_engagement, paid_members, join_reward, invite_reward]
    purpose_fields: [purpose, category, memo, reason, for]
    denied_purposes: [members, member, followers, follower, engagement, invites, invite, joins, join, reactions,
                      likes, reviews, votes, upvotes, subscribers, views]
  data_collection:
    personal_fields: [email, emails, phone, phone_number, address, ip, ip_address, real_name, full_name, birthday,
                      date_of_birth, age, location, gender, private_messages, dms, dm_history]
    field_list_args: [fields, columns, attributes, collect, export_fields, scrape_fields, select]
  profiling:                        # field names; in generated code (opaque payloads) the same words as parts of
                                    # identifiers send the action to the operator
    fields: [profile_user, profile_users, user_profile, user_traits, traits, personality, psychographic,
             per_user_scores, sentiment_by_user, user_dossier, track_user, track_users, infer_attributes,
             psychological_profile, vulnerability_score, per_user_traits]
  vulnerable:
    audience_fields: [audience, target_audience, segment, target_users, target_group, target_segment, filter,
                      age_range, min_age, max_age, cohort]
    terms: [minor, minors, child, children, kid, kids, underage, "under 13", "under 18", teen, teens, teenager,
            teenagers, elderly, senior, seniors, addict, addicts, addiction, gambling, depressed, depression,
            suicidal, grieving, bereaved, lonely, disabled, "in debt", "financial distress", vulnerable]
    # outbound content naming two vulnerable groups, or one together with one of these, goes to the operator
    exploit_terms: ["quick cash", "easy money", "fast money", "free money", "get rich", "payday", "loan", "loans",
                    "crypto", "investment", "invest", "betting", "casino", "jackpot", "cash prize", "debt relief",
                    "need money", "need cash", "dm me", "private message me"]
  credentials:
    field_names: [password, passwd, passphrase, api_key, apikey, secret, client_secret, access_token, refresh_token,
                  bot_token, auth_token, token, authorization, private_key, cookie, session_cookie]
    reference_prefix: "secret:"     # a credential field may only name a vault entry, e.g. "secret:site_token"
    patterns:
      - {id: K-PRIVATE-KEY, regex: "-----BEGIN [A-Z ]*PRIVATE KEY-----"}
      - {id: K-BEARER, regex: "(?i)\\bbearer\\s+[A-Za-z0-9_\\-\\.=]{20,}"}
      - {id: K-BOT-TOKEN, regex: "\\b[MNO][A-Za-z0-9_\\-]{23,25}\\.[A-Za-z0-9_\\-]{6}\\.[A-Za-z0-9_\\-]{27,45}\\b"}
      - {id: K-AWS-KEY, regex: "\\bAKIA[0-9A-Z]{16}\\b"}
      - {id: K-BASIC-AUTH-URL, regex: "(?i)\\bhttps?://[^/\\s:@]+:[^/\\s:@]+@"}
  content_patterns:                 # applied to outbound content of writes; verdict: deny | needs_approval
    # join-for-join and reciprocal membership
    - {id: C-JOIN-FOR-JOIN, class: join_for_join, verdict: deny,
       regex: "(?i)\\b(join|sub|subscribe|follow|like|member)[\\s\\-_]*(for|4|2)[\\s\\-_]*(join|sub|subscribe|follow|like|member)s?\\b|\\b(j4j|s4s|f4f|l4l|sub4sub|follow4follow)\\b"}
    - {id: C-RECIPROCAL-JOIN, class: join_for_join, verdict: needs_approval,
       regex: "(?i)\\bjoin\\s+(mine|ours|my\\s+\\w+|our\\s+\\w+)\\b.{0,60}\\b(i|we)('ll| will)\\s+join\\b"}
    - {id: C-RECIPROCAL-MEMBERSHIP, class: join_for_join, verdict: needs_approval,
       regex: "(?i)\\b(join|joins|joining|become\\s+(a\\s+)?members?|follow|subscribe)\\b[^.!?\\n]{0,80}\\b(and|then|&)\\b[^.!?\\n]{0,60}\\b(we|i|our\\s+\\w+(\\s+\\w+)?|my\\s+\\w+)('ll|\\s+will)?\\s+(also\\s+)?(join|joins|become|becomes|follow|follows|subscribe|subscribes)\\b"}
    - {id: C-MEMBER-SWAP, class: join_for_join, verdict: needs_approval,
       regex: "(?i)\\b(member|members|server|sub|follow|join)\\s*(swap|swaps|exchange|trade|trading)\\b|\\b(mutual|reciprocal)\\s+(join|joins|follow|follows|sub|subs|membership|members)\\b|\\bpartners?\\s+wanted\\b"}
    # payment or reward conditional on engagement, in either order
    - {id: C-PAID-ENGAGEMENT, class: paid_engagement, verdict: needs_approval,
       regex: "(?i)\\b(paid|pay|pays|payment|cash|money|reward|rewards|rewarded|prize|prizes|gift\\s*cards?|vouchers?|coupons?|discounts?|nitro|bonus|bonuses|giveaway|free\\s+(nitro|money|stuff|gift|gifts|items?|coins?)|\\d+\\s*(dollars?|usd|eur|euros?|pounds?|gbp|bucks)|\\$\\s?\\d+|€\\s?\\d+|£\\s?\\d+|airdrop)\\b.{0,100}\\b(join|joins|joined|joining|invite|invites|invited|inviting|refer|referral|referrals|react|reacts|reaction|reactions|member|members|membership|boost|boosts|boosting|follow|follows|followers|upvote|upvotes|review|reviews|likes|subscribe|subscribers|sign\\s*up|signups?)\\b"}
    - {id: C-ENGAGEMENT-REWARD, class: paid_engagement, verdict: needs_approval,
       regex: "(?i)\\b(join|joins|joining|invite|invites|inviting|refer|referral|referrals|react|reacts|boost|boosts|follow|upvote|upvotes|review|reviews|subscribe|sign\\s*up|bring)\\b.{0,100}\\b(paid|pay|pays|payment|cash|money|reward|rewards|rewarded|prize|prizes|gift\\s*cards?|vouchers?|coupons?|discounts?|nitro|bonus|bonuses|giveaway|\\d+\\s*(dollars?|usd|eur|euros?|pounds?|gbp|bucks)|\\$\\s?\\d+|€\\s?\\d+|£\\s?\\d+|airdrop)\\b"}
    # deceptive identity: claiming to be human / not automated
    - {id: C-HUMAN-CLAIM, class: deceptive_identity, verdict: deny,
       regex: "(?i)\\b(i\\s*am|i'm)\\s+(a\\s+)?(real\\s+)?(human|person)\\b|\\b(i\\s*am|i'm)\\s+not\\s+a\\s+(bot|robot|ai)\\b"}
    - {id: C-HUMAN-CLAIM-BROAD, class: deceptive_identity, verdict: needs_approval,
       regex: "(?i)\\b(i\\s*am|i'm|we\\s*are|we're|speaking\\s+as|writing\\s+as|posting\\s+as|here\\s+as)\\b[^.!?\\n]{0,40}\\b(real\\s+|actual\\s+|genuine\\s+)?(human|humans|person|people)\\b"}
    - {id: C-AUTOMATION-DENIAL, class: deceptive_identity, verdict: needs_approval,
       regex: "(?i)\\b(no|not|without|zero|never|nothing)\\s+(any\\s+)?(automation|automated|automatic|bots?|robots?|ai|scripts?|scripted)\\b|\\b(is|are|am)\\s*n[o']?t\\s+(a\\s+|an\\s+)?(bot|robot|ai|automated)\\b|\\bnot\\s+a\\s+(bot|robot|ai)\\b|\\b(written|run|operated|typed)\\s+by\\s+(a\\s+)?(real\\s+)?(human|person)\\b"}
    # deceptive identity: claiming authority / platform staff, phishing
    - {id: C-AUTHORITY-CLAIM, class: deceptive_identity, verdict: needs_approval,
       regex: "(?i)\\b(official|verified)\\b.{0,30}\\b(staff|support|moderator|admin|representative|employee|team)\\b"}
    - {id: C-PLATFORM-STAFF, class: deceptive_identity, verdict: needs_approval,
       regex: "(?i)\\btrust\\s*(and|&)\\s*safety\\b|\\b(discord|slack|telegram|reddit|google|meta|facebook|instagram|twitter|apple|microsoft|steam|paypal|github|youtube|tiktok|whatsapp)\\s+(staff|support|team|admins?|moderation|moderators?|security|safety|official|employees?|hq)\\b"}
    - {id: C-ACCOUNT-PHISHING, class: deceptive_identity, verdict: needs_approval,
       regex: "(?i)\\b(account|server|profile)\\s+(is|has\\s+been|was|will\\s+be)\\s+(flagged|suspended|banned|terminated|locked|disabled|deleted|compromised|reported|under\\s+review)\\b|\\b(confirm|verify|validate|update|re-?enter)\\s+(your\\s+)?(account\\s+|login\\s+|payment\\s+|personal\\s+|billing\\s+)?(details|identity|credentials|password|login|information|info|card)\\b"}
